<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img" aria-label="A booking link and the confirmation steps that follow without an email thread">
  <style>
    :root{--bg:#e6f2f2;--card:#ffffff;--line:#c9dddd;--ink:#0a1f24;--muted:#44585e;--brand:#0b6b74;--soft:#cdeaec;--warm:#fde8d3;--warmline:#c2570c;--hatch:#e8f0f0}
    @media (prefers-color-scheme: dark){:root{--bg:#0c2a30;--card:#0f3039;--line:#244a53;--ink:#e9f4f5;--muted:#a7bec3;--brand:#4fd1dc;--soft:#17505a;--warm:#4a3220;--warmline:#f0a060;--hatch:#16404a}}
    text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  </style>
  <rect width="640" height="480" rx="28" fill="var(--bg)"/>
  <rect x="60" y="56" width="520" height="84" rx="42" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
  <text x="104" y="106" font-size="22" font-weight="700" fill="var(--ink)">tidepool.example/maren</text>
  <rect x="448" y="76" width="112" height="44" rx="22" fill="var(--brand)"/>
  <text x="504" y="105" text-anchor="middle" font-size="18" font-weight="800" fill="var(--card)">Copy</text>
  <path d="M320 140V176" stroke="var(--brand)" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 10"/>
  <g>
    <rect x="60" y="188" width="520" height="68" rx="16" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
    <circle cx="106" cy="222" r="18" fill="var(--soft)" stroke="var(--brand)" stroke-width="3"/>
    <path d="M97 222l7 7 12-14" fill="none" stroke="var(--brand)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="142" y="229" font-size="21" font-weight="700" fill="var(--ink)">Guest picks Tue 10:30</text>
    <rect x="60" y="272" width="520" height="68" rx="16" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
    <circle cx="106" cy="306" r="18" fill="var(--soft)" stroke="var(--brand)" stroke-width="3"/>
    <path d="M97 306l7 7 12-14" fill="none" stroke="var(--brand)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="142" y="313" font-size="21" font-weight="700" fill="var(--ink)">Invites sent, video link added</text>
    <rect x="60" y="356" width="520" height="68" rx="16" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
    <circle cx="106" cy="390" r="18" fill="var(--soft)" stroke="var(--brand)" stroke-width="3"/>
    <path d="M97 390l7 7 12-14" fill="none" stroke="var(--brand)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="142" y="397" font-size="21" font-weight="700" fill="var(--ink)">Reminder set for 1 hour before</text>
  </g>
</svg>
